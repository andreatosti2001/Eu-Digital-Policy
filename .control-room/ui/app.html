<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Control Room</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<a class="skip" href="#main">Skip to the current view</a>
<header>
  <div class="brand">
    <strong>Control Room</strong>
    <span class="env" id="env"></span>
  </div>
  <nav aria-label="Views">
    <button data-view="live" class="tab" aria-current="true">Live system</button>
    <button data-view="queue" class="tab">Review queue</button>
    <button data-view="health" class="tab">Website health</button>
    <button data-view="audit" class="tab">Audit trail</button>
    <button data-view="operators" class="tab">Access</button>
  </nav>
  <div class="who">
    <span id="actor"></span>
    <button id="logout" type="button">Sign out</button>
  </div>
</header>

<p class="banner">
  Approving a proposal records an authorization in
  <code>agent/implement/decisions/decisions.jsonl</code>. It publishes nothing: the
  Implementation Agent re-derives the authorization and runs its own gates before anything
  reaches the site.
</p>

<main id="main" tabindex="-1">
  <p id="status">Loading…</p>
  <section id="view"></section>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
