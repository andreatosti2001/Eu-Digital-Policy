# ============================================================
# Pages — the deploy gate
#
# QA FAIL → NO DEPLOY. This workflow publishes the site ONLY if the
# checks below pass on the exact commit being published, and it
# publishes only the website itself (tools/pages-artifact.mjs), never
# the repository.
#
# IT GATES NOTHING UNTIL A PERSON CHANGES ONE SETTING, and that is said
# here rather than implied. GitHub Pages currently serves `main` from the
# repository root ("Deploy from a branch"). While that setting stands,
# every push to `main` is published by GitHub's own Pages build whatever
# this workflow concludes. To make this the gate:
#
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# docs/DEPLOYMENT.md has that step, the branch-protection rule that makes
# the QA checks required on pull requests, and what each one blocks.
#
# WHAT GATES AND WHAT DOES NOT. The gate is the set of checks that say
# something about the published site: the four validators at their
# recorded baseline, the evidence audit, the validators' own suite, the
# public/private boundary, the browser suite, and the adversarial
# verification gate. Until 27 Sep 2026 the adversarial gate was left out
# because it was red on purpose (HE-04) and a gate that is always red
# publishes nothing. The author then decided HE-04 is to decide from what
# the tree establishes (docs/PRODUCTION-OPERATING-MODE.md §4a); the gate
# is green and now blocks a deploy when an attack succeeds. The
# production-mode checks stay in qa.yml only: they describe the agent
# layer's operating mode, not the published site.
# ============================================================

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate-data:
    name: Gate — data, markup and evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: commit-evidence.mjs — published changes name their evidence
        # The author's rule of 27 Sep 2026 (docs/PRODUCTION-OPERATING-MODE.md
        # §5): a commit that changes a published file carries an
        # "Evidence:" trailer. Commits older than the rule are not judged.
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          node tools/commit-evidence.mjs --self-test
          HEAD_SHA="$GITHUB_SHA"; BASE=""
          if [ "$EVENT" = "pull_request" ]; then BASE="$PR_BASE"; HEAD_SHA="$PR_HEAD";
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then BASE="$BEFORE";
          else BASE="$(git merge-base origin/main "$GITHUB_SHA" 2>/dev/null || true)"; fi
          if [ -z "$BASE" ] || [ "$BASE" = "$HEAD_SHA" ]; then echo "Nothing to judge: no earlier commit to compare against."; exit 0; fi
          node tools/commit-evidence.mjs "$BASE" "$HEAD_SHA"

      - name: validate.mjs
        run: node tools/validate.mjs
      - name: i18n-audit.mjs
        run: node tools/i18n-audit.mjs
      - name: design-qa.mjs (includes the CSP and the inline-handler checks)
        run: node tools/design-qa.mjs
      - name: freshness.mjs (defects fail; staleness is reported)
        run: node tools/freshness.mjs
      - name: evidence-audit.mjs
        run: node tools/evidence-audit.mjs
      - name: The validators' own suite
        run: node --test tools/selftest.mjs
      - name: Against the recorded baseline
        run: node agent/implement/cli.mjs check --as-of "$(date -u +%Y-%m-%d)"

  gate-boundary:
    name: Gate — public / private boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: No credential in the published surface
        run: node agent/implement/cli.mjs boundary
      - name: The Control Room stays behind the dot prefix
        run: node .control-room/cli.mjs boundary
      - name: The artifact is the website and nothing else
        run: node tools/pages-artifact.mjs build _site

  gate-browser:
    name: Gate — browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install a browser on the runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends chromium-browser \
            || sudo apt-get install -y --no-install-recommends chromium
          echo "BROWSER_QA_CHROME=$(command -v chromium-browser || command -v chromium)" >> "$GITHUB_ENV"
      - name: The browser suite (a missing browser is a failure)
        run: node agent/browser/cli.mjs --require-browser

  gate-security:
    name: Gate — adversarial verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: No attack against the boundary succeeds
        run: node agent/policy/verify/cli.mjs

  build:
    name: Build the artifact
    needs: [gate-data, gate-boundary, gate-browser, gate-security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: The website, from the allowlist
        run: node tools/pages-artifact.mjs build _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
