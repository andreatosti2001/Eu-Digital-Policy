# ============================================================
# QA — the checks this repository has never had run automatically
#
# docs/AUDIT-2026-09-01.md F-02: "there is no CI, no package.json and
# no git hook. Nothing runs unless somebody runs it." This workflow
# is the answer to the first third of that. It installs nothing —
# there is still no package.json, and adding one would be a red-tier
# architectural change (docs/AUTONOMY-POLICY.md Class D).
#
# IT IS NOT A DEPLOY GATE. Deployment is GitHub Pages serving `main`
# at the repository root and there is no mechanism between a push and
# the live site. This workflow makes a failure VISIBLE; it cannot
# make it blocking. Say so rather than implying otherwise: a green
# tick here means the checks ran and passed, not that the site was
# gated on them. Making it a gate needs a branch protection rule,
# which is repository configuration outside this tree.
#
# THE BROWSER JOB IS THE POINT OF SESSION 19. It runs the repository's
# own browser suite against a browser the runner already has. If no
# browser is found the suite exits 2 and `--require-browser` turns
# that into a hard failure — because a suite that goes green when it
# could not open a browser teaches this pipeline that green means
# checked.
# ============================================================

name: QA

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      quick:
        description: 'Run the browser suite in --quick mode'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------
  # 1. The four validators — this project's test suite
  # ----------------------------------------------------------
  validators:
    name: The four validators
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Show the toolchain
        run: |
          echo "node $(node --version)"
          echo "No dependencies, no build step, no package.json. Nothing is installed."

      # Each named separately so the job summary says WHICH one failed.
      - name: validate.mjs — data integrity
        run: node tools/validate.mjs

      - name: i18n-audit.mjs — the locale register against the live DOM
        run: node tools/i18n-audit.mjs

      - name: design-qa.mjs — markup and stylesheets
        run: node tools/design-qa.mjs

      # SESSION 30. Its exit code now reports DEFECTS in the tree and
      # not the passage of time. Everything it reported before it still
      # reports, in full and by name, and the staleness prompts are
      # printed and counted — what changed is that a result which flips
      # with the calendar on unchanged bytes no longer fails a build.
      # The contract is at the head of tools/freshness.mjs and
      # tools/selftest.mjs holds it to it from both sides.
      - name: freshness.mjs — how stale the datasets are
        run: node tools/freshness.mjs

      # SESSION 30. The validators' own suite. Until now nothing tested
      # the four checks that are this project's test suite, and two of
      # this session's findings were defects in a check rather than in
      # the thing checked. It plants a Google Fonts @import, a remote
      # fetch, a preconnect and a missing `resolution` field, and
      # asserts each is caught.
      - name: tools/selftest.mjs — the validators' own suite
        run: node --test tools/selftest.mjs

      # The comparison the four validators cannot make themselves:
      # against the recorded baseline in docs/CURRENT-ARCHITECTURE.md
      # §12. A new warning is a finding, not noise.
      - name: Against the recorded baseline
        run: node agent/implement/cli.mjs check --as-of "$(date -u +%Y-%m-%d)"

  # ----------------------------------------------------------
  # 2. The agent suites and the contracts
  # ----------------------------------------------------------
  agents:
    name: The agent suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # SESSION 28. fetch-depth 0 because the governance evidence
      # check resolves commit anchors: a pattern about the history
      # cites the commits it reads. On the default shallow checkout
      # those anchors report `unresolvable_here` rather than failing
      # — which is correct and is worth nothing, because a check that
      # cannot see its subject checks nothing.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: The inter-agent contracts
        run: node --test agent/schemas/selftest.mjs

      - name: Every agent suite
        run: |
          set -e
          for s in \
            agent/scout/selftest.mjs \
            agent/scout/schedule/selftest.mjs \
            agent/verifier/selftest.mjs \
            agent/integrate/selftest.mjs \
            agent/detector/selftest.mjs \
            agent/depth/selftest.mjs \
            agent/proposals/data/selftest.mjs \
            agent/architect/selftest.mjs \
            agent/proposals/editorial/selftest.mjs \
            agent/proposals/governance/selftest.mjs \
            agent/ux/selftest.mjs \
            agent/observability/selftest.mjs \
            agent/implement/selftest.mjs \
            agent/health/selftest.mjs \
            agent/orchestrator/selftest.mjs \
            agent/policy/selftest.mjs \
            agent/policy/verify/selftest.mjs \
            agent/simulation/selftest.mjs \
            agent/autonomy/selftest.mjs \
            agent/improve/selftest.mjs \
            agent/production/selftest.mjs \
            .control-room/selftest.mjs
          do
            echo "::group::$s"
            node --test "$s"
            echo "::endgroup::"
          done

      - name: Every contract is satisfiable by its fixture
        run: node agent/schemas/cli.mjs check

      # SESSION 28. Every anchor under every pattern in
      # agent/proposals/governance/ resolved against the tree of this
      # commit. It exits 1 only on a REFUTED anchor — a pattern
      # citing something this tree contradicts — and never on one it
      # cannot check here. It writes nothing and decides nothing; the
      # seven proposals it derives all require human approval and
      # none has been decided.
      #
      # IT RUNS BEFORE THE REGISTERS BELOW, and the reason has now
      # been removed rather than worked around. The Orchestrator's
      # register step exited 1 from the SESSION 26 merge until
      # SESSION 29 — agent/orchestrator/cli.mjs imported
      # AUTONOMY_NOTE, which policy.mjs stopped exporting when the
      # note became derived — and a failing step skips every step
      # after it in the same job, which is why this step and the two
      # below it were moved ahead of it. SESSION 29 repaired the
      # import: the CLI now calls autonomyNote(), so the note is
      # derived from the grant ledger instead of asserting that no
      # category is approved, which stopped being true in SESSION 26.
      # The ordering is kept anyway. It costs nothing and the next
      # break will not hide these.
      - name: The governance evidence, and what has never been decided
        run: |
          node agent/proposals/governance/cli.mjs check
          node agent/proposals/governance/cli.mjs corpus

      # SESSION 27, at the merge with SESSION 28. These two steps were
      # registered AFTER the Orchestrator's registers and were therefore
      # SKIPPED on every run, because a failing step skips every step
      # after it in the same job and that register has exited 1 since the
      # SESSION 26 merge. AGENTS.md and docs/CONTINUOUS-IMPROVEMENT.md
      # both said "reach runs on every push", which was false for exactly
      # as long as nobody read the job. Moved ahead of the break, which
      # is what SESSION 28 did with the governance step and for the same
      # reason. The register itself is still not repaired:
      # docs/GOVERNANCE-PROPOSALS.md 6b.
      # SESSION 26. What limited autonomy is switched on to do, printed
      # on every push. It RUNS NOTHING — no branch is cut, no proposal
      # is applied, no ledger line is written — and it is here because
      # a governance grant that changed without anybody noticing is the
      # thing this whole layer is arranged against. The grant ledger is
      # git-tracked, so a diff to it is visible in review; this makes
      # its EFFECT visible too.
      - name: What limited autonomy is switched on to do
        run: |
          node agent/policy/cli.mjs governance
          node agent/autonomy/cli.mjs status

      # SESSION 27. What the grant can actually REACH, measured against
      # the tree on this commit rather than inferred from the grant.
      # It runs nothing and writes nothing. It is here because the
      # grant names eight fields on data/sources.json and six of them
      # are not in that file, so a permission can be in force over a
      # surface that does not exist — and the day one of those fields
      # is added, this step is where it becomes visible.
      - name: What limited autonomy can reach
        run: node agent/improve/cli.mjs reach

      # SESSION 22. Three tables the rest of the system is checked
      # against: the ten workflow types, the capability register, and
      # the policy. Each RUNS NOTHING — no workflow is opened, no
      # specialist is dispatched, no journal is written — so this is a
      # readable record of what the Orchestrator would permit, on
      # every push, at no risk.
      - name: The Orchestrator's registers
        run: |
          node agent/orchestrator/cli.mjs workflows
          node agent/orchestrator/cli.mjs capabilities
          node agent/orchestrator/cli.mjs policy

      # The tree must be byte-identical afterwards. Every suite here
      # hashes what it reads; this checks the claim from outside all
      # of them, which is the only place it is worth checking.
      - name: Nothing was written
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error title=The suites wrote to the repository::A read-only suite changed the tree."
            git status --porcelain
            exit 1
          fi
          echo "clean"

  # ----------------------------------------------------------
  # 3. The public/private boundary
  # ----------------------------------------------------------
  boundary:
    name: Public website / private control plane
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Fails on a credential in a file the website loads, or in any
      # published file that is not a declared test fixture. The
      # control-plane exposure this repository has today is reported
      # as a warning on every run: it is a standing architectural
      # fact, not something a given change introduced.
      - name: Scan the published surface
        run: node agent/implement/cli.mjs boundary

      # SESSION 21. The Control Room lives behind the ONE publication
      # boundary this repository has — a GitHub Pages deployment with
      # no _config.yml does not serve a path whose segments begin with
      # "." — and this asks whether that is still true, on the actual
      # tree, rather than assuming it. It also fails on a credential
      # in the Control Room's own files, on any private state that has
      # become git-tracked, and on a route that could deploy, delete
      # or publish.
      #
      # It provisions nobody and starts no server, so it needs no
      # configuration.
      - name: The Control Room boundary
        run: node .control-room/cli.mjs boundary

      - name: Every route, and the permission it needs
        run: node .control-room/cli.mjs routes

  # ----------------------------------------------------------
  # 3b. SESSION 20 — the health monitor
  #
  # It runs WITHOUT the browser here, because the browser job below
  # already runs the suite and running it twice doubles the slowest
  # step to re-derive numbers the health monitor would only be
  # reporting. The six browser-sourced public-website metrics come
  # back `unmeasurable` in this job and SAY SO — which is the whole
  # design, and is why running it this way is honest rather than a
  # shortcut: the report states what it could not see.
  # ----------------------------------------------------------
  health:
    name: Website health monitor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: The metric register
        run: node agent/health/cli.mjs --metrics

      # --no-record: a CI runner is thrown away, so a history entry
      # written here would be lost, and a history with one entry per
      # push and no continuity is worse than none.
      - name: Measure the three domains
        run: node agent/health/cli.mjs --as-of "$(date -u +%Y-%m-%d)" --no-browser --no-record

      # The public-safe subset, as an artifact rather than as a
      # commit. Publishing is a decision; this makes the subset
      # available to whoever takes it.
      - name: Produce the public-safe subset
        run: node agent/health/cli.mjs --as-of "$(date -u +%Y-%m-%d)" --no-browser --no-record --publish health-public.json > /dev/null

      - name: Upload it
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: health-public
          path: health-public.json
          if-no-files-found: warn
          retention-days: 90

      - name: Nothing was written to the repository
        run: |
          rm -f health-public.json
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error title=The health monitor wrote to the repository::A monitor that alters what it measures is the least trustworthy thing in the system."
            git status --porcelain
            exit 1
          fi
          echo "clean"

  # ----------------------------------------------------------
  # 3c. SESSION 23.5 — the adversarial verification gate
  #
  # IN A JOB OF ITS OWN, AND THAT IS THE WHOLE DESIGN. The gate has
  # exited 1 since SESSION 24 on a CRITICAL finding, and a failing
  # step skips every step after it in the same job — which is
  # exactly how two other checks came to be registered behind a
  # break and never run (docs/GOVERNANCE-PROPOSALS.md §6b). A step
  # that is expected to be red must therefore hide nothing, so it
  # gets a job to itself.
  #
  # SESSION 29 ADDED THIS, and its absence was the standing lesson:
  # AGENTS.md recorded that a CRITICAL stayed red across five
  # sessions because the workflow ran the gate's own SUITE and never
  # the gate. The suite proves the gate is reproducible. It does not
  # report what the gate FOUND.
  #
  # It starts a Control Room on an ephemeral loopback port, attacks
  # it, and writes nothing.
  # ----------------------------------------------------------
  security:
    name: The adversarial verification gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Sixty-nine attacks against the boundary
        run: node agent/policy/verify/cli.mjs

      - name: Nothing was written
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error title=The verification gate wrote to the repository::"
            git status --porcelain
            exit 1
          fi
          echo "clean"

  # ----------------------------------------------------------
  # 3d. SESSION 29 — production operating mode
  #
  # Four read-only verbs. None of them runs an agent, opens a
  # workflow, writes a record or decides anything, and there is no
  # verb in that directory that could.
  #
  # `trace` IS LAST ON PURPOSE. It exits 1 on a standing finding —
  # two of the three ways this website can change leave no durable
  # record naming the evidence — and putting it anywhere but last
  # would hide the three checks above it.
  # ----------------------------------------------------------
  production:
    name: Production operating mode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: The operating schedule
        run: node agent/production/cli.mjs schedule

      - name: The final visual standard for the hidden entry
        run: node agent/production/cli.mjs visual

      - name: Discovery is not authentication is not authorization
        run: node agent/production/cli.mjs separations

      - name: What is traceable, and what is not
        run: node agent/production/cli.mjs trace

  # ----------------------------------------------------------
  # 4. SESSION 19 — the browser suite
  # ----------------------------------------------------------
  browser:
    name: Browser regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA_QUICK: ${{ inputs.quick && '--quick' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # ubuntu-latest ships Chromium via snap, which headless Chrome
      # cannot always start from. apt is the reliable route and it is
      # a RUNNER dependency, not a repository one: nothing is added to
      # the tree and `node agent/browser/cli.mjs` still runs on any
      # machine that already has a browser.
      - name: Install a browser on the runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends chromium-browser \
            || sudo apt-get install -y --no-install-recommends chromium
          echo "BROWSER_QA_CHROME=$(command -v chromium-browser || command -v chromium)" >> "$GITHUB_ENV"

      - name: Report which browser this run used
        run: |
          echo "BROWSER_QA_CHROME=$BROWSER_QA_CHROME"
          "$BROWSER_QA_CHROME" --version

      - name: The suite's own suite
        run: node --test agent/browser/selftest.mjs

      # --require-browser: a missing browser is a hard failure here,
      # not the exit 2 a developer gets locally. In CI there is no
      # human to read "skipped".
      - name: Run the browser regression suite
        run: node agent/browser/cli.mjs --require-browser $QA_QUICK

      - name: Store the machine-readable result
        if: always()
        run: node agent/browser/cli.mjs --json --require-browser $QA_QUICK > browser-qa.json || true

      - name: Upload it
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-qa
          path: browser-qa.json
          if-no-files-found: warn
          retention-days: 30

      - name: Nothing was written
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error title=The browser suite wrote to the repository::"
            git status --porcelain
            exit 1
          fi
          echo "clean"

  # ----------------------------------------------------------
  # 5. What did NOT run, said out loud
  # ----------------------------------------------------------
  report:
    name: What this workflow does not prove
    needs: [validators, agents, boundary, health, security, production, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Say it
        run: |
          {
            echo "### What a green tick here means"
            echo
            echo "The four validators returned to the recorded baseline in"
            echo '`docs/CURRENT-ARCHITECTURE.md` §12, every agent suite passed, every contract is'
            echo "satisfiable by its fixture, no credential is in the published surface, and the"
            echo "browser suite opened every page."
            echo
            echo "### What it does not mean"
            echo
            echo "- **It is not a deploy gate.** Deployment is GitHub Pages serving \`main\` at the"
            echo "  repository root. Nothing sits between a push and the live site; a failure here is"
            echo "  visible, not blocking. Making it blocking needs a branch protection rule."
            echo "- **The validators do not read prose.** A false statement in \`index.html\` passes"
            echo "  every check in this repository."
            echo "- **No URL has ever been fetched.** \`freshness.mjs\` prints a SOURCE REACHABILITY"
            echo "  heading and performs no network I/O (AUDIT F-12)."
            echo "- **No contrast was computed and no screen reader was run.** README limitation 7."
            echo "- **106 records carry an unverified note.** They are changed by doing the"
            echo "  verification work, not by a passing check."
            echo "- **No Control Room instance was reached.** The suite starts one on an ephemeral"
            echo "  loopback port and proves the boundary against it; nothing here has ever spoken"
            echo "  to a deployed one, and \`control_plane.control_room_availability\` reports"
            echo "  \`unmeasurable\` for that reason."
            echo "- **No real identity provider was contacted.** The OIDC flow is proved against a"
            echo "  local stub with a real key pair — signature, issuer, audience, expiry, nonce,"
            echo "  PKCE and state are genuinely checked, and a forged signature and \`alg: none\`"
            echo "  are genuinely refused — but nothing here has spoken to Auth0, Okta, Entra or"
            echo "  Keycloak, and this environment's network policy means nothing could."
            echo "- **No workflow was run and no specialist was dispatched.** SESSION 22 wires no"
            echo "  dispatcher: the Orchestrator's suite drives it with fixture specialists, and its"
            echo "  three register commands above run nothing at all. The first end-to-end execution"
            echo "  is the simulation protocol §25 puts at SESSION 24."
            echo "- **There is no overall health score, and a green tick is not one.** The health"
            echo "  monitor reports three domains separately and never sums them; nine of its"
            echo "  metrics report \`unmeasurable\` in this job because the browser does not run in it."
          } >> "$GITHUB_STEP_SUMMARY"
